<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梅西耶天体 (M天体) 探索与练习 designed by 木瓜</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Noto Sans SC -->
    <link href="https://gs.jurieo.com/gemini/fonts-googleapis/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Phosphor Icons (高级UI图标库) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- 本地自定义样式 -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="antialiased flex flex-col items-center py-4 px-4 sm:px-6 lg:px-8 relative">

    <!-- 动态星空背景 -->
    <canvas id="starfield"></canvas>

    <div class="w-full max-w-5xl z-10">
        <!-- 标题区域 -->
        <header id="main-header" class="text-center mb-6 animate-slide-up">
            <h1 class="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-indigo-400 to-purple-400 mb-3 neon-text tracking-wider">
                星海拾贝
            </h1>
            <p class="text-indigo-200/80 text-lg md:text-xl font-light tracking-wide flex items-center justify-center gap-2">
                <i class="ph-fill ph-planet text-2xl text-purple-400"></i>
                梅西耶天体的探索之旅
            </p>
        </header>

        <!-- 主菜单 (模式选择) -->
        <div id="main-menu" class="glass-card rounded-3xl p-8 md:p-10 animate-fade-in">
            <h2 class="text-2xl font-medium mb-8 text-center text-white/90">请选择您的探索模式</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8">
                <!-- 模式1 -->
                <button onclick="startMode('imageToKnowledge')" class="flex flex-col items-center p-8 rounded-2xl border border-gray-600/30 bg-gray-800/40 hover:bg-gray-700/60 transition-all duration-300 group hover:-translate-y-2 hover:shadow-[0_15px_30px_-10px_rgba(59,130,246,0.3)]">
                    <div id="icon-container-1" class="w-20 h-20 rounded-2xl bg-blue-900/40 border border-blue-500/30 flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300 icon-glow glow-blue">
                        <i class="ph-duotone ph-image text-4xl text-blue-400"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-white">看图识星</h3>
                    <p class="text-sm text-gray-400 text-center leading-relaxed">根据深空天体图片，辨认其对应的M编号典型特征及重要知识。</p>
                </button>

                <!-- 模式2 -->
                <button onclick="startMode('nameToImage')" class="flex flex-col items-center p-8 rounded-2xl border border-gray-600/30 bg-gray-800/40 hover:bg-gray-700/60 transition-all duration-300 group hover:-translate-y-2 hover:shadow-[0_15px_30px_-10px_rgba(168,85,247,0.3)]">
                    <div id="icon-container-2" class="w-20 h-20 rounded-2xl bg-purple-900/40 border border-purple-500/30 flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300 icon-glow glow-purple">
                        <i class="ph-duotone ph-telescope text-4xl text-purple-400"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-white">寻星索骥</h3>
                    <p class="text-sm text-gray-400 text-center leading-relaxed">根据天体编号及俗称，锁定其真实图像。</p>
                </button>

                <!-- 模式3 -->
                <button onclick="startMode('flashcards')" class="flex flex-col items-center p-8 rounded-2xl border border-gray-600/30 bg-gray-800/40 hover:bg-gray-700/60 transition-all duration-300 group hover:-translate-y-2 hover:shadow-[0_15px_30px_-10px_rgba(16,185,129,0.3)]">
                    <div id="icon-container-3" class="w-20 h-20 rounded-2xl bg-emerald-900/40 border border-emerald-500/30 flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300 icon-glow glow-emerald">
                        <i class="ph-duotone ph-cards text-4xl text-emerald-400"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-white">星空闪卡</h3>
                    <p class="text-sm text-gray-400 text-center leading-relaxed">背诵模式，点击翻转卡片即可探索详细的M天体知识。</p>
                </button>
            </div>
        </div>

        <!-- 测验/学习区域 (初始隐藏) -->
        <div id="quiz-container" class="hidden animate-fade-in w-full max-w-4xl mx-auto">
            <!-- 顶部状态栏 -->
            <div class="flex justify-between items-center mb-6 px-2">
                <button onclick="returnToMenu()" class="text-gray-400 hover:text-white flex items-center text-sm transition-colors group px-3 py-1.5 rounded-lg hover:bg-gray-800/50">
                    <i class="ph ph-caret-left text-lg mr-1 group-hover:-translate-x-1 transition-transform"></i>
                    返回基地
                </button>
                <div class="bg-gray-800/60 border border-gray-700/50 px-4 py-1.5 rounded-full backdrop-blur-sm">
                    <span id="progress-indicator" class="text-sm font-semibold tracking-widest text-blue-300">1 / 10</span>
                </div>
            </div>

            <!-- 核心内容区 -->
            <div id="content-area" class="glass-card rounded-3xl p-6 md:p-10 shadow-2xl">
                <!-- 内容由JS动态生成 -->
            </div>
        </div>

        <!-- 结果区域 (初始隐藏) -->
        <div id="result-screen" class="hidden glass-card rounded-3xl p-10 text-center animate-fade-in max-w-2xl mx-auto mt-10">
            <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-gradient-to-br from-yellow-400 to-orange-600 mb-6 shadow-[0_0_40px_rgba(251,191,36,0.4)]">
                <i class="ph-fill ph-trophy text-5xl text-white"></i>
            </div>
            <h2 class="text-3xl font-bold mb-2 text-white">探索完成！</h2>
            <p class="text-lg text-gray-300 mb-8">本次航行收集数据：</p>

            <div class="bg-gray-900/50 border border-gray-700 rounded-2xl p-6 mb-8 inline-block min-w-[250px]">
                <p class="text-sm text-gray-400 mb-1">正确识别</p>
                <p class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">
                    <span id="final-score">0</span><span class="text-2xl text-gray-500 font-normal"> / <span id="total-questions">10</span></span>
                </p>
            </div>

            <p id="result-message" class="text-gray-300 mb-10 text-lg"></p>

            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button onclick="retryCurrentMode()" class="px-8 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl font-bold transition-all shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:shadow-[0_0_30px_rgba(79,70,229,0.5)] flex items-center justify-center gap-2">
                    <i class="ph-bold ph-arrow-counter-clockwise text-xl"></i> 重新启航
                </button>
                <button onclick="returnToMenu()" class="px-8 py-3 bg-gray-700/80 hover:bg-gray-600 text-white border border-gray-600 rounded-xl font-bold transition-all flex items-center justify-center gap-2">
                    <i class="ph-bold ph-list text-xl"></i> 返回控制台
                </button>
            </div>
        </div>
    </div>

    <!-- 数据与逻辑（顺序不可调换：data.js 先于 app.js） -->
    <script src="data/data.js"></script>
    <script src="js/app.js"></script>

    <!-- 页面防护 -->
    <script src="https://cdn.jsdelivr.net/npm/disable-devtool"></script>
    <script src="js/protect.js"></script>
</body>
</html>
