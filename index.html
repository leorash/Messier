<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梅西耶天体 (M天体) 探索与练习 designed by 木瓜</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Noto Sans SC -->
    <link href="https://gs.jurieo.com/gemini/fonts-googleapis/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons (高级UI图标库) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            color: #e2e8f0;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            /* 基础背景色，作为canvas加载前的回退 */
            background-color: #04050a; 
        }
        
        /* 动态星空画布置于底层 */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        /* 强化毛玻璃效果卡片 */
        .glass-card {
            background: linear-gradient(145deg, rgba(20, 24, 36, 0.6) 0%, rgba(10, 12, 18, 0.8) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.7), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* 霓虹发光文字标题 */
        .neon-text {
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.4);
        }

        /* 闪卡翻转动画 */
        .flip-card {
            background-color: transparent;
            perspective: 1000px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .flip-card-back {
            transform: rotateY(180deg);
            overflow-y: auto;
        }

        /* 自定义滚动条 - 更纤细精美 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1); 
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15); 
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3); 
        }

        /* 选项按钮悬浮与发光效果 */
        .option-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
            border-color: rgba(96, 165, 250, 0.5);
            background-color: rgba(30, 41, 59, 0.9);
        }
        .option-btn:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }
        
        .correct-answer {
            background-color: rgba(16, 185, 129, 0.15) !important;
            border-color: #10b981 !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3) !important;
        }
        .wrong-answer {
            background-color: rgba(239, 68, 68, 0.15) !important;
            border-color: #ef4444 !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3) !important;
        }

        /* 菜单项图标背景光晕 */
        .icon-glow {
            position: relative;
        }
        .icon-glow::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 120%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            filter: blur(15px);
            z-index: -1;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .group:hover .icon-glow::after {
            opacity: 0.9;
        }
        .glow-blue::after { background: rgba(59, 130, 246, 0.4); }
        .glow-purple::after { background: rgba(168, 85, 247, 0.4); }
        .glow-emerald::after { background: rgba(16, 185, 129, 0.4); }

        /* 简单动画 */
        .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="antialiased flex flex-col items-center py-4 px-4 sm:px-6 lg:px-8 relative">

    <!-- 动态星空背景 -->
    <canvas id="starfield"></canvas>

    <div class="w-full max-w-5xl z-10">
        <!-- 标题区域 -->
        <!-- 修改点：添加 id="main-header"，并将 mb-12 修改为 mb-6 减小下方间距，使主菜单上移 -->
        <header id="main-header" class="text-center mb-6 animate-slide-up">
            <h1 class="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-indigo-400 to-purple-400 mb-3 neon-text tracking-wider">
                星海拾贝
            </h1>
            <p class="text-indigo-200/80 text-lg md:text-xl font-light tracking-wide flex items-center justify-center gap-2">
                <i class="ph-fill ph-planet text-2xl text-purple-400"></i>
                梅西耶天体的探索之旅
            </p>
        </header>

        <!-- 主菜单 (模式选择) -->
        <div id="main-menu" class="glass-card rounded-3xl p-8 md:p-10 animate-fade-in">
            <h2 class="text-2xl font-medium mb-8 text-center text-white/90">请选择您的探索模式</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8">
                <!-- 模式1 -->
                <button onclick="startMode('imageToKnowledge')" class="flex flex-col items-center p-8 rounded-2xl border border-gray-600/30 bg-gray-800/40 hover:bg-gray-700/60 transition-all duration-300 group hover:-translate-y-2 hover:shadow-[0_15px_30px_-10px_rgba(59,130,246,0.3)]">
                    <div id="icon-container-1" class="w-20 h-20 rounded-2xl bg-blue-900/40 border border-blue-500/30 flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300 icon-glow glow-blue">
                        <i class="ph-duotone ph-image text-4xl text-blue-400"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-white">看图识星</h3>
                    <p class="text-sm text-gray-400 text-center leading-relaxed">根据深空天体图片，辨认其对应的M编号典型特征及重要知识。</p>
                </button>

                <!-- 模式2 -->
                <button onclick="startMode('nameToImage')" class="flex flex-col items-center p-8 rounded-2xl border border-gray-600/30 bg-gray-800/40 hover:bg-gray-700/60 transition-all duration-300 group hover:-translate-y-2 hover:shadow-[0_15px_30px_-10px_rgba(168,85,247,0.3)]">
                    <div id="icon-container-2" class="w-20 h-20 rounded-2xl bg-purple-900/40 border border-purple-500/30 flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300 icon-glow glow-purple">
                        <i class="ph-duotone ph-telescope text-4xl text-purple-400"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-white">寻星索骥</h3>
                    <p class="text-sm text-gray-400 text-center leading-relaxed">根据天体编号及俗称，锁定其真实图像。</p>
                </button>

                <!-- 模式3 -->
                <button onclick="startMode('flashcards')" class="flex flex-col items-center p-8 rounded-2xl border border-gray-600/30 bg-gray-800/40 hover:bg-gray-700/60 transition-all duration-300 group hover:-translate-y-2 hover:shadow-[0_15px_30px_-10px_rgba(16,185,129,0.3)]">
                    <div id="icon-container-3" class="w-20 h-20 rounded-2xl bg-emerald-900/40 border border-emerald-500/30 flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300 icon-glow glow-emerald">
                        <i class="ph-duotone ph-cards text-4xl text-emerald-400"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-white">星空闪卡</h3>
                    <p class="text-sm text-gray-400 text-center leading-relaxed">背诵模式，点击翻转卡片即可探索详细的M天体知识。</p>
                </button>
            </div>
        </div>

        <!-- 测验/学习区域 (初始隐藏) -->
        <div id="quiz-container" class="hidden animate-fade-in w-full max-w-4xl mx-auto">
            <!-- 顶部状态栏 -->
            <div class="flex justify-between items-center mb-6 px-2">
                <button onclick="returnToMenu()" class="text-gray-400 hover:text-white flex items-center text-sm transition-colors group px-3 py-1.5 rounded-lg hover:bg-gray-800/50">
                    <i class="ph ph-caret-left text-lg mr-1 group-hover:-translate-x-1 transition-transform"></i> 
                    返回基地
                </button>
                <div class="bg-gray-800/60 border border-gray-700/50 px-4 py-1.5 rounded-full backdrop-blur-sm">
                    <span id="progress-indicator" class="text-sm font-semibold tracking-widest text-blue-300">1 / 10</span>
                </div>
            </div>

            <!-- 核心内容区 -->
            <div id="content-area" class="glass-card rounded-3xl p-6 md:p-10 shadow-2xl">
                <!-- 内容由JS动态生成 -->
            </div>
        </div>

        <!-- 结果区域 (初始隐藏) -->
        <div id="result-screen" class="hidden glass-card rounded-3xl p-10 text-center animate-fade-in max-w-2xl mx-auto mt-10">
            <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-gradient-to-br from-yellow-400 to-orange-600 mb-6 shadow-[0_0_40px_rgba(251,191,36,0.4)]">
                <i class="ph-fill ph-trophy text-5xl text-white"></i>
            </div>
            <h2 class="text-3xl font-bold mb-2 text-white">探索完成！</h2>
            <p class="text-lg text-gray-300 mb-8">本次航行收集数据：</p>
            
            <div class="bg-gray-900/50 border border-gray-700 rounded-2xl p-6 mb-8 inline-block min-w-[250px]">
                <p class="text-sm text-gray-400 mb-1">正确识别</p>
                <p class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">
                    <span id="final-score">0</span><span class="text-2xl text-gray-500 font-normal"> / <span id="total-questions">10</span></span>
                </p>
            </div>

            <p id="result-message" class="text-gray-300 mb-10 text-lg"></p>
            
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button onclick="retryCurrentMode()" class="px-8 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl font-bold transition-all shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:shadow-[0_0_30px_rgba(79,70,229,0.5)] flex items-center justify-center gap-2">
                    <i class="ph-bold ph-arrow-counter-clockwise text-xl"></i> 重新启航
                </button>
                <button onclick="returnToMenu()" class="px-8 py-3 bg-gray-700/80 hover:bg-gray-600 text-white border border-gray-600 rounded-xl font-bold transition-all flex items-center justify-center gap-2">
                    <i class="ph-bold ph-list text-xl"></i> 返回控制台
                </button>
            </div>
        </div>
    </div>

    <script>
        /* --- 自定义配图配置区 --- */
        // 在下方双引号内填入图片URL即可替换首页对应的图标。留空则继续使用默认图标。
        const CUSTOM_ICONS = {
            imageToKnowledge: "https://i.hd-r.cn/a3765d28-055c-4a91-a39b-0cba4f271345.jpg", // 看图识星 配图URL，例如："https://example.com/icon1.jpg"
            nameToImage: "https://i.hd-r.cn/25860dae-d00f-4a9a-be11-bc07a4da4a94.png",      // 寻星索骥 配图URL
            flashcards: "https://i.hd-r.cn/d5b221e4-a18d-43be-98b8-31444952283d.jpg"        // 星空闪卡 配图URL
        };

        window.addEventListener('DOMContentLoaded', () => {
            if (CUSTOM_ICONS.imageToKnowledge) {
                const c1 = document.getElementById('icon-container-1');
                c1.innerHTML = `<img src="${CUSTOM_ICONS.imageToKnowledge}" class="w-full h-full object-cover rounded-2xl" alt="看图识星">`;
                c1.classList.remove('p-4'); // 如果存在内边距，移除以适应全幅图片
            }
            if (CUSTOM_ICONS.nameToImage) {
                const c2 = document.getElementById('icon-container-2');
                c2.innerHTML = `<img src="${CUSTOM_ICONS.nameToImage}" class="w-full h-full object-cover rounded-2xl" alt="寻星索骥">`;
                c2.classList.remove('p-4');
            }
            if (CUSTOM_ICONS.flashcards) {
                const c3 = document.getElementById('icon-container-3');
                c3.innerHTML = `<img src="${CUSTOM_ICONS.flashcards}" class="w-full h-full object-cover rounded-2xl" alt="星空闪卡">`;
                c3.classList.remove('p-4');
            }
        });

        /* --- 动态星空画布逻辑 --- */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function initStars() {
            stars = [];
            const numStars = Math.floor((width * height) / 4000); // 根据屏幕大小决定星星数量
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.1,
                    speed: Math.random() * 0.1 + 0.02, // 缓慢自东向西（右向左）移动速度
                    opacity: Math.random(),
                    twinkleSpeed: Math.random() * 0.02 + 0.005,
                    twinkleDir: Math.random() > 0.5 ? 1 : -1
                });
            }
        }

        function drawStars() {
            // 深邃宇宙底色
            ctx.fillStyle = '#04050a';
            ctx.fillRect(0, 0, width, height);

            // 绘制星云氛围 (大范围柔和渐变)
            const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height));
            gradient.addColorStop(0, 'rgba(20, 24, 44, 0.4)');
            gradient.addColorStop(0.5, 'rgba(10, 12, 24, 0.2)');
            gradient.addColorStop(1, 'rgba(4, 5, 10, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                // 自东向西移动
                star.x -= star.speed;

                // 移出左侧边界后从右侧重新出现
                if (star.x < 0) {
                    star.x = width;
                    star.y = Math.random() * height; // 高度重新随机，避免成排
                }

                // 闪烁逻辑
                star.opacity += star.twinkleSpeed * star.twinkleDir;
                if (star.opacity >= 1) {
                    star.opacity = 1;
                    star.twinkleDir = -1;
                } else if (star.opacity <= 0.1) {
                    star.opacity = 0.1;
                    star.twinkleDir = 1;
                }

                // 绘制星星主体
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.fill();
                
                // 更亮的星星带有极微弱的光晕
                if(star.radius > 1.2 && star.opacity > 0.6) {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius * 3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity * 0.2})`;
                    ctx.fill();
                }
            });

            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initStars();
        });
        
        resizeCanvas();
        initStars();
        drawStars();

        /* --- M天体数据源 --- */
        // 注意：UI显示区已解除所有长度截断限制，支持无限滚动。
        // 请在此处对应的 info 字段中，严格粘贴您文档中的“补充知识”，系统会分毫不差地呈现。
        const messierData = [
            { id: "M1", name: "蟹状星云", url: "https://i.hd-r.cn/f192b500-cda6-48b2-ac41-d662305fd91f.jpg", type: "超新星残骸", const: "金牛座", mag: "8.4", info: "著名的超新星遗迹，源于中国宋代天文学家记录的“天关客星”爆炸，中心包含一颗高速旋转的脉冲星。" },
            { id: "M6", name: "蝴蝶星团", url: "https://i.imgs.ovh/2026/09/15/9bd7b5d57a5a95302ec5d6a5d63f6fe4.jpg", type: "疏散星团", const: "天蝎座", mag: "4.2", info: "疏散的星群排列形状酷似一只展翅飞舞的蝴蝶，在夏季银河中不难辨认。" },
            { id: "M7", name: "托勒密星团", url: "https://i.hd-r.cn/a2037bcc-93cf-4b44-9bfd-9e06b8b30337.jpg", type: "疏散星团", const: "天蝎座", mag: "3.3", info: "天空中最明亮、最巨大的疏散星团之一，早在公元130年就被古希腊天文学家托勒密肉眼观测并记录。" },
            { id: "M8", name: "礁湖星云", url: "https://i.hd-r.cn/67366a31-e2f5-4ed7-9913-9c2de1f15a11.jpg", type: "发射星云与疏散星团", const: "人马座", mag: "6", info: "外观有一条贯穿星云的暗带，形似被陆地环绕的浅水湖泊，是夏季银河中著名的恒星诞生区。" },
            { id: "M11", name: "野鸭星团", url: "https://i.hd-r.cn/e85d69e0-eb37-4b8a-8ad8-7292f1d58e72.jpg", type: "疏散星团", const: "盾牌座", mag: "6.3", info: "已知最密集、最紧凑的疏散星团之一，星群呈现的V字形排列让人联想到一群正在飞行的野鸭。" },
            { id: "M13", name: "武仙座球状星团", url: "https://i.hd-r.cn/b830f18e-0f27-4999-9c05-f196e0e6c895.jpg", type: "球状星团", const: "武仙座", mag: "5.8", info: "北半球天空中最明亮、最壮观的球状星团，包含数十万颗恒星，曾是1974年人类发送“阿雷西博信息”以寻找外星文明的目标。" },
            { id: "M16", name: "鹰星云", url: "https://i.hd-r.cn/e3519592-bc29-4b9a-8a9f-2026dabb75d1.jpg", type: "发射星云、电离氢区与疏散星团", const: "巨蛇座", mag: "6", info: "著名的恒星孕育场，哈勃空间望远镜拍摄的经典天体照片“创生之柱”就位于该星云的核心区域。" },
            { id: "M17", name: "天鹅星云", url: "https://i.hd-r.cn/e9abcdad-ae11-4d54-87ed-f724a4716c5e.jpg", type: "发射星云、电离氢区与疏散星团", const: "人马座", mag: "6", info: "它的形状既像在水面上游动的白天鹅，又像希腊字母Ω，是一个极其明亮且活跃的电离氢区。" },
            { id: "M20", name: "三裂星云", url: "https://i.hd-r.cn/a3765d28-055c-4a91-a39b-0cba4f271345.jpg", type: "发射星云、电离氢区与疏散星团", const: "人马座", mag: "6.3", info: "它被暗星云的尘埃带分割成三个明显的发光区域，同时包含了红色发射星云、蓝色反射星云和暗星云三种形态，色彩对比极为鲜明。" },
            { id: "M22", name: "人马座星团", url: "https://i.hd-r.cn/31efd335-0028-433e-a261-fb4cc3a20d79.jpg", type: "球状星团", const: "人马座", mag: "5.1", info: "天空中最明亮的球状星团之一，也是已知少数几个内部含有行星状星云的罕见球状星团。" },

            { id: "M64", name: "黑眼星系", url: "https://i.hd-r.cn/cd7feff5-6ec4-4769-a235-ab4f5e804111.jpg", type: "螺旋星系", const: "后发座", mag: "9.4", info: "核心极其明亮，但在其前方有一条非常厚重、醒目的半环形暗尘埃带，仿佛一只被打青了的“黑眼圈”。" },

            { id: "M76", name: "小哑铃星云", url: "https://i.hd-r.cn/ce88c2c9-411c-4909-85c0-27d95be2c080.jpg", type: "行星状星云", const: "英仙座", mag: "10.1", info: "梅西耶天体中最暗、最难观测的一个，因形状与M27相似但尺寸更小、更暗淡，故得名小哑铃星云。" },
            { id: "M77", name: "鲸鱼A星系", url: "https://i.hd-r.cn/400b6c9f-fc56-4f03-a296-a94ea1cce0b2.jpg", type: "棒旋星系", const: "鲸鱼座", mag: "9.6", info: "是一个非常活跃的赛弗特星系（活动星系核），其中心隐藏着一个超大质量黑洞，并释放出强烈的射电辐射。" },
            { id: "M78", name: "鬼马小精灵星云", url: "https://i.hd-r.cn/2fb683ac-291a-4e74-bd33-45f360fd9665.jpg", type: "反射星云", const: "猎户座", mag: "8.3", info: "夜空中最明亮的反射星云之一，在照片中仿佛是两个发光的眼睛从黑暗的尘埃云中探出，形似卡通里的幽灵或晴天娃娃。" },
            { id: "M81", name: "波德星系", url: "https://i.hd-r.cn/c1c074a7-e565-4535-b875-ffe0f03c4e52.jpg", type: "螺旋星系", const: "大熊座", mag: "6.9", info: "大熊座中最明亮的螺旋星系之一，拥有极其完美、对称的经典“宏象旋臂”结构。" },
            { id: "M82", name: "雪茄星系", url: "https://i.hd-r.cn/551923ad-9c7a-4c9f-b603-a4af9f099e4a.jpg", type: "星暴星系", const: "大熊座", mag: "8.4", info: "受到旁边M81巨大引力拉扯的影响，它是一个正在经历剧烈恒星爆发的星暴星系，核心区域向外垂直喷发着巨大的红色氢气流。" },
            { id: "M83", name: "南风车星系", url: "https://i.hd-r.cn/ffacf51a-b111-45e8-b56c-01844a130562.jpg", type: "棒旋星系", const: "长蛇座", mag: "7.5", info: "不仅拥有壮丽的正面棒旋结构，而且还是发现超新星爆发频率最高的星系之一，常被称为“千个红宝石星系”。" },
            { id: "M87", name: "室女A星系", url: "https://i.hd-r.cn/f57a29ba-6b53-455b-94a1-6c97b968bb53.jpg", type: "椭圆星系", const: "室女座", mag: "9.6", info: "室女座星系团的中心巨型椭圆星系，拥有一道长达数千光年的高能等离子体喷流，也是人类史上首张黑洞照片的拍摄目标诞生地。" },
            { id: "M97", name: "猫头鹰星云", url: "https://i.hd-r.cn/4a5d07ba-67e7-464e-b722-f5c2a94054fa.jpg", type: "行星状星云", const: "大熊座", mag: "9.9", info: "圆形的星云盘面上有两个相对暗淡的空洞，看起来酷似猫头鹰的两只大眼睛，是一个特征非常鲜明的行星状星云。" },
            { id: "M101", name: "风车星系", url: "https://i.hd-r.cn/4633b410-30f9-4c0f-9832-590e4954700d.jpg", type: "螺旋星系", const: "大熊座", mag: "7.9", info: "正面对着地球的大型螺旋星系，由于其分布面积广且旋臂明显不对称，看起来像一个巨大的转动风车。" },
            { id: "M104", name: "墨西哥草帽星系", url: "https://i.hd-r.cn/d5b221e4-a18d-43be-98b8-31444952283d.jpg", type: "螺旋星系", const: "室女座", mag: "9", info: "拥有一个极其明亮且巨大的核心隆起，并且在赤道盘面上有一条非常明显的暗尘埃带贯穿，侧面看极像一顶宽边墨西哥草帽。" }
        ];

        // 状态变量
        let currentMode = '';
        let quizQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let hasAnswered = false;
        
        const QUESTIONS_PER_ROUND = 10;

        const elMainMenu = document.getElementById('main-menu');
        const elQuizContainer = document.getElementById('quiz-container');
        const elResultScreen = document.getElementById('result-screen');
        const elContentArea = document.getElementById('content-area');
        const elProgressIndicator = document.getElementById('progress-indicator');

        // 纯随机洗牌算法 (Fisher-Yates) - 确保题目和选项每次都是完全随机的
        function shuffleArray(array) {
            const arr = [...array]; // 创建副本，确保不修改原数组引用
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateOptions(correctItem) {
            // 剔除正确答案，剩下的打乱
            let availableItems = messierData.filter(item => item.id !== correctItem.id);
            let shuffledAvailable = shuffleArray(availableItems);
            
            let options = [correctItem];
            // 纯随机挑选3个干扰项
            for(let i=0; i<3; i++) {
                options.push(shuffledAvailable[i]);
            }
            // 最终对这4个选项再次进行纯随机排序，确保正确答案位置每次都随机
            return shuffleArray(options);
        }

        function generateQuestions(mode) {
            // 对所有题库进行纯随机打乱，抽取前N题
            let shuffledData = shuffleArray(messierData);
            let limit = mode === 'flashcards' ? messierData.length : QUESTIONS_PER_ROUND;
            let selectedItems = shuffledData.slice(0, limit);
            
            return selectedItems.map(item => {
                return {
                    correct: item,
                    options: generateOptions(item)
                };
            });
        }

        function showScreen(screenId) {
            elMainMenu.classList.add('hidden');
            elQuizContainer.classList.add('hidden');
            elResultScreen.classList.add('hidden');
            
            const target = document.getElementById(screenId);
            target.classList.remove('hidden');
            
            // 修改点：根据当前页面是否为主菜单，决定是否显示顶部标题，隐藏标题后有效节约纵向空间
            const header = document.getElementById('main-header');
            if (screenId === 'main-menu') {
                header.classList.remove('hidden');
            } else {
                header.classList.add('hidden');
            }
            
            // 重新触发动画
            target.classList.remove('animate-fade-in');
            void target.offsetWidth; 
            target.classList.add('animate-fade-in');
        }

        function returnToMenu() {
            showScreen('main-menu');
        }

        function startMode(mode) {
            currentMode = mode;
            quizQuestions = generateQuestions(mode);
            currentQuestionIndex = 0;
            score = 0;
            
            showScreen('quiz-container');
            renderCurrentView();
        }

        function retryCurrentMode() {
            startMode(currentMode);
        }

        function renderCurrentView() {
            hasAnswered = false;
            let q = quizQuestions[currentQuestionIndex];
            
            if (currentMode === 'imageToKnowledge') {
                renderImageToKnowledge(q);
            } else if (currentMode === 'nameToImage') {
                renderNameToImage(q);
            } else if (currentMode === 'flashcards') {
                renderFlashcard(q);
            }
            
            // 更新进度条
            if (currentMode === 'flashcards') {
                elProgressIndicator.innerText = `${currentQuestionIndex + 1} / ${quizQuestions.length}`;
            } else {
                elProgressIndicator.innerText = `${currentQuestionIndex + 1} / ${QUESTIONS_PER_ROUND}`;
            }
        }

        function renderImageToKnowledge(q) {
            let html = `
                <div class="flex flex-col items-center w-full">
                    <div class="flex items-center gap-2 mb-6">
                        <i class="ph-duotone ph-camera text-2xl text-blue-400"></i>
                        <h3 class="text-2xl font-medium text-white tracking-wide">请识别该深空天体</h3>
                    </div>
                    <div class="w-full max-w-md h-72 mb-8 rounded-2xl overflow-hidden border border-gray-600/50 shadow-[0_10px_30px_rgba(0,0,0,0.5)] group relative">
                        <img src="${q.correct.url}" alt="Mystery Object" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent pointer-events-none"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full" id="options-container">
                        ${q.options.map((opt) => `
                            <button onclick="checkAnswer('${opt.id}', this)" class="option-btn border border-gray-600/40 bg-gray-800/60 rounded-xl p-5 text-center flex flex-col items-center justify-center backdrop-blur-md">
                                <span class="font-black text-xl text-white mb-1">${opt.id}</span>
                                <span class="text-sm text-gray-400">${opt.name}</span>
                            </button>
                        `).join('')}
                    </div>
                    
                    <div id="feedback-area" class="w-full mt-8 hidden">
                        <div class="p-6 rounded-2xl bg-gray-800/80 border border-gray-600/50 backdrop-blur-lg shadow-xl relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-1 h-full bg-blue-500" id="feedback-accent"></div>
                            <h4 class="text-2xl font-bold mb-4 flex items-center gap-3">
                                <span id="feedback-icon" class="text-3xl"></span>
                                <span class="text-white">${q.correct.id} - ${q.correct.name}</span>
                            </h4>
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 text-sm text-gray-300 mb-4 bg-gray-900/50 p-4 rounded-xl">
                                <p><span class="text-gray-500 block text-xs mb-1">种类</span><span class="font-medium">${q.correct.type}</span></p>
                                <p><span class="text-gray-500 block text-xs mb-1">星座</span><span class="font-medium">${q.correct.const}</span></p>
                                <p><span class="text-gray-500 block text-xs mb-1">视星等</span><span class="font-medium">${q.correct.mag}</span></p>
                            </div>
                            <p class="text-gray-300 leading-relaxed text-sm">${q.correct.info}</p>
                        </div>
                        <button onclick="nextQuestion()" class="mt-6 w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-xl font-bold transition-all shadow-[0_0_15px_rgba(79,70,229,0.4)] flex justify-center items-center gap-2">
                            ${currentQuestionIndex < QUESTIONS_PER_ROUND - 1 ? '继续探索 <i class="ph-bold ph-arrow-right"></i>' : '查看航行报告 <i class="ph-bold ph-flag-checkered"></i>'}
                        </button>
                    </div>
                </div>
            `;
            elContentArea.innerHTML = html;
        }

        function renderNameToImage(q) {
            let html = `
                <div class="flex flex-col items-center w-full">
                    <div class="flex items-center gap-2 mb-2 text-purple-400">
                        <i class="ph-duotone ph-crosshair text-xl"></i>
                        <h3 class="text-lg font-medium tracking-wide">目标定位</h3>
                    </div>
                    <h2 class="text-4xl font-extrabold mb-8 text-center text-white neon-text">${q.correct.id} <span class="text-2xl text-gray-400 ml-2 font-normal">${q.correct.name}</span></h2>
                    
                    <div class="grid grid-cols-2 gap-4 md:gap-6 w-full max-w-2xl" id="options-container">
                        ${q.options.map((opt) => `
                            <button onclick="checkAnswer('${opt.id}', this)" class="option-btn border-2 border-gray-600/30 rounded-2xl overflow-hidden aspect-[4/3] relative group bg-black">
                                <img src="${opt.url}" alt="Option" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity duration-300">
                                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end justify-center pb-4">
                                    <span class="text-white font-bold tracking-widest text-sm bg-black/60 px-4 py-1.5 rounded-full border border-gray-500/50 backdrop-blur-sm">锁定目标</span>
                                </div>
                            </button>
                        `).join('')}
                    </div>

                    <div id="feedback-area" class="w-full mt-8 hidden max-w-2xl">
                        <div class="p-6 rounded-2xl bg-gray-800/80 border border-gray-600/50 backdrop-blur-lg shadow-xl relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-1 h-full bg-purple-500" id="feedback-accent"></div>
                            <h4 class="text-2xl font-bold mb-4 flex items-center gap-3">
                                <span id="feedback-icon" class="text-3xl"></span>
                                <span class="text-white">天体数据解密</span>
                            </h4>
                            <div class="flex flex-wrap gap-4 text-sm text-gray-300 mb-4 bg-gray-900/50 p-4 rounded-xl">
                                <span class="bg-gray-800 px-3 py-1 rounded-md border border-gray-700"><strong>种类:</strong> ${q.correct.type}</span>
                                <span class="bg-gray-800 px-3 py-1 rounded-md border border-gray-700"><strong>星座:</strong> ${q.correct.const}</span>
                            </div>
                            <p class="text-gray-300 leading-relaxed text-sm">${q.correct.info}</p>
                        </div>
                        <button onclick="nextQuestion()" class="mt-6 w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 rounded-xl font-bold transition-all shadow-[0_0_15px_rgba(168,85,247,0.4)] flex justify-center items-center gap-2">
                            ${currentQuestionIndex < QUESTIONS_PER_ROUND - 1 ? '继续探索 <i class="ph-bold ph-arrow-right"></i>' : '查看航行报告 <i class="ph-bold ph-flag-checkered"></i>'}
                        </button>
                    </div>
                </div>
            `;
            elContentArea.innerHTML = html;
        }

        function renderFlashcard(q) {
            let html = `
                <div class="flex flex-col items-center w-full">
                    <div class="flex items-center justify-center gap-2 mb-6 text-emerald-400">
                        <i class="ph-duotone ph-cards text-2xl"></i>
                        <p class="text-sm tracking-widest font-medium">点击翻转 探索奥秘</p>
                    </div>
                    
                    <div class="w-full max-w-md h-[420px] flip-card cursor-pointer group" onclick="this.classList.toggle('flipped')">
                        <div class="flip-card-inner shadow-[0_20px_50px_-15px_rgba(0,0,0,0.6)]">
                            <!-- 正面：图片 -->
                            <div class="flip-card-front bg-gray-900 border border-gray-600/50 overflow-hidden">
                                <img src="${q.correct.url}" alt="${q.correct.id}" class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex flex-col justify-end p-6">
                                    <div class="flex items-center gap-2 text-emerald-400/80 mb-1 group-hover:text-emerald-300 transition-colors">
                                        <i class="ph-bold ph-arrows-left-right"></i>
                                        <span class="text-xs font-bold tracking-widest uppercase">Tap to flip</span>
                                    </div>
                                </div>
                            </div>
                            <!-- 反面：详细知识 -->
                            <div class="flip-card-back bg-gradient-to-br from-gray-800 to-gray-900 p-8 flex flex-col justify-start items-center text-left border border-gray-600/50 relative overflow-hidden">
                                <!-- 装饰性背景图标 -->
                                <i class="ph-fill ph-planet absolute -bottom-10 -right-10 text-9xl text-gray-700/20"></i>
                                
                                <div class="w-full text-center mb-6 z-10">
                                    <h2 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-400 mb-1">${q.correct.id}</h2>
                                    <h3 class="text-xl font-medium text-white">${q.correct.name}</h3>
                                </div>
                                
                                <div class="w-full space-y-3 mb-6 z-10">
                                    <div class="flex justify-between items-center border-b border-gray-700/50 pb-3">
                                        <span class="text-gray-400 text-sm flex items-center gap-1"><i class="ph ph-tag"></i> 分类</span>
                                        <span class="font-medium text-gray-200 text-right">${q.correct.type}</span>
                                    </div>
                                    <div class="flex justify-between items-center border-b border-gray-700/50 pb-3">
                                        <span class="text-gray-400 text-sm flex items-center gap-1"><i class="ph ph-star"></i> 星座</span>
                                        <span class="font-medium text-gray-200 text-right">${q.correct.const}</span>
                                    </div>
                                    <div class="flex justify-between items-center border-b border-gray-700/50 pb-3">
                                        <span class="text-gray-400 text-sm flex items-center gap-1"><i class="ph ph-eye"></i> 视星等</span>
                                        <span class="font-medium text-gray-200">${q.correct.mag}</span>
                                    </div>
                                </div>
                                
                                <div class="w-full bg-black/30 p-4 rounded-xl text-sm leading-relaxed text-gray-300 overflow-y-auto z-10 border border-gray-700/50">
                                    ${q.correct.info}
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex justify-between w-full max-w-md mt-10">
                        <button onclick="prevCard()" class="px-6 py-3 bg-gray-800/80 hover:bg-gray-700 border border-gray-600/50 rounded-xl disabled:opacity-30 disabled:cursor-not-allowed transition-all flex items-center gap-2 backdrop-blur-sm" ${currentQuestionIndex === 0 ? 'disabled' : ''}>
                            <i class="ph-bold ph-caret-left"></i> 上一张
                        </button>
                        <button onclick="nextCard()" class="px-6 py-3 bg-emerald-600/90 hover:bg-emerald-500 rounded-xl disabled:opacity-30 disabled:cursor-not-allowed transition-all shadow-[0_0_15px_rgba(16,185,129,0.3)] flex items-center gap-2 backdrop-blur-sm" ${currentQuestionIndex === quizQuestions.length - 1 ? 'disabled' : ''}>
                            下一张 <i class="ph-bold ph-caret-right"></i>
                        </button>
                    </div>
                </div>
            `;
            elContentArea.innerHTML = html;
        }

        function checkAnswer(selectedId, btnElement) {
            if (hasAnswered) return;
            hasAnswered = true;
            
            let q = quizQuestions[currentQuestionIndex];
            let isCorrect = selectedId === q.correct.id;
            
            const accentBar = document.getElementById('feedback-accent');
            const iconEl = document.getElementById('feedback-icon');
            
            if (isCorrect) {
                score++;
                btnElement.classList.add('correct-answer');
                iconEl.innerHTML = '<i class="ph-fill ph-check-circle text-emerald-400"></i>';
                if(accentBar) accentBar.className = 'absolute top-0 left-0 w-1 h-full bg-emerald-500';
            } else {
                btnElement.classList.add('wrong-answer');
                iconEl.innerHTML = '<i class="ph-fill ph-x-circle text-red-400"></i>';
                if(accentBar) accentBar.className = 'absolute top-0 left-0 w-1 h-full bg-red-500';
                
                // 标出正确答案
                const buttons = document.querySelectorAll('#options-container button');
                buttons.forEach(b => {
                    if(b.getAttribute('onclick').includes(q.correct.id)) {
                        b.classList.add('correct-answer');
                    }
                });
            }
            
            // 禁用所有按钮
            const allButtons = document.querySelectorAll('#options-container button');
            allButtons.forEach(b => {
                b.disabled = true;
                b.style.cursor = 'default';
            });
            
            // 显示反馈区
            const feedbackArea = document.getElementById('feedback-area');
            feedbackArea.classList.remove('hidden');
            // 重新触发动画
            void feedbackArea.offsetWidth;
            feedbackArea.classList.add('animate-slide-up');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < QUESTIONS_PER_ROUND) {
                renderCurrentView();
            } else {
                showResults();
            }
        }

        function nextCard() {
            if (currentQuestionIndex < quizQuestions.length - 1) {
                currentQuestionIndex++;
                renderCurrentView();
            }
        }

        function prevCard() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderCurrentView();
            }
        }

        function showResults() {
            showScreen('result-screen');
            
            // 滚动数字动画效果
            let currentScore = 0;
            const scoreEl = document.getElementById('final-score');
            document.getElementById('total-questions').innerText = QUESTIONS_PER_ROUND;
            
            const timer = setInterval(() => {
                if(currentScore >= score) {
                    clearInterval(timer);
                    scoreEl.innerText = score;
                } else {
                    currentScore++;
                    scoreEl.innerText = currentScore;
                }
            }, 50); // 简单的数字增长动画
            
            let message = "";
            let ratio = score / QUESTIONS_PER_ROUND;
            if (ratio === 1) message = "完美！你已获得「深空天体导航员」最高头衔！🌌";
            else if (ratio >= 0.8) message = "极其出色，宇宙深处的秘密已被你洞悉大半！✨";
            else if (ratio >= 0.6) message = "干得不错，下一次航行一定会更上一层楼！🚀";
            else message = "万事开头难，多用“星空闪卡”在基地里模拟训练一下吧！🔭";
            
            document.getElementById('result-message').innerText = message;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/disable-devtool"></script>
    <script>
      if (typeof DisableDevtool === 'function') {
        DisableDevtool({
          disableMenu: true,
          interval: 200,
          clearInterval: true,
          ondevtoolopen: function () {
            window.location.replace('about:blank');
          }
        });
      } else {
        console.warn('DisableDevtool 未加载，启用备用防护');
      }

      document.addEventListener('keydown', function (e) {
        const k = e.key ? e.key.toUpperCase() : '';
        if (
          k === 'F12' ||
          (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C')) ||
          (e.ctrlKey && (k === 'U' || k === 'S' || k === 'P'))
        ) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, true);

      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        return false;
      }, true);
    </script>
</body>
</html>
